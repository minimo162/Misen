name: PR76 temporary verification

on:
  push:
    branches:
      - codex/issue-74-prepared-runtime

permissions:
  contents: read

jobs:
  prepared-runtime-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Reproduce Windows packaging paths at substantive port head
        shell: pwsh
        run: |
          $TargetSha = 'ab6bc64ed97ecb1302c9cfed5885cdc83adde9a9'
          if (Test-Path 'C:\misen-pr76') { Remove-Item 'C:\misen-pr76' -Recurse -Force }
          if (Test-Path 'C:\misen-temp') { Remove-Item 'C:\misen-temp' -Recurse -Force }
          New-Item -ItemType Directory -Path 'C:\misen-temp' | Out-Null
          git clone --no-local "$env:GITHUB_WORKSPACE" 'C:\misen-pr76'
          git -C 'C:\misen-pr76' checkout --detach $TargetSha
          if ((git -C 'C:\misen-pr76' rev-parse HEAD) -ne $TargetSha) { throw 'substantive port SHA mismatch' }
          'TEMP=C:\misen-temp' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'TMP=C:\misen-temp' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'PR76_TARGET_SHA=ab6bc64ed97ecb1302c9cfed5885cdc83adde9a9' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install frozen dependencies
        shell: pwsh
        run: |
          Set-Location 'C:\misen-pr76\apps\enterprise-misen'
          npm ci
      - name: Build complete app
        shell: pwsh
        run: |
          Set-Location 'C:\misen-pr76\apps\enterprise-misen'
          npm run build
      - name: All non-security tests
        shell: pwsh
        run: |
          Set-Location 'C:\misen-pr76\apps\enterprise-misen'
          $files = Get-ChildItem -Path 'dist\test' -Recurse -Filter '*.test.js' | Where-Object { $_.Name -ne 'security.test.js' } | ForEach-Object { $_.FullName }
          if (-not $files) { throw 'no compiled tests found' }
          & node --test $files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen production security tests except known internal-symlink policy mismatch
        shell: pwsh
        run: |
          Set-Location 'C:\misen-pr76\apps\enterprise-misen'
          node --test --test-name-pattern='authority roster|resource boundary|output-only boundary|secret sentinel|hardlink|injected atomic' dist/test/security.test.js
      - name: External symlink escape remains rejected
        shell: pwsh
        run: |
          @'
          import { strict as assert } from 'node:assert'
          import { mkdtemp, rm, symlink, writeFile } from 'node:fs/promises'
          import { tmpdir } from 'node:os'
          import { join } from 'node:path'
          import { WorkspaceBoundary } from 'file:///C:/misen-pr76/apps/enterprise-misen/dist/src/workspace/boundary.js'
          const root = await mkdtemp(join(tmpdir(), 'misen-external-link-root-'))
          const outside = await mkdtemp(join(tmpdir(), 'misen-external-link-outside-'))
          try {
            await writeFile(join(outside, 'secret.txt'), 'secret')
            await symlink(join(outside, 'secret.txt'), join(root, 'link.txt'))
            await assert.rejects(new WorkspaceBoundary(root).readFileBytes('link.txt'), /escapes the selected workspace/u)
            console.log('external symlink escape rejected')
          } finally {
            await rm(root, { recursive: true, force: true })
            await rm(outside, { recursive: true, force: true })
          }
          '@ | Set-Content 'C:\misen-temp\external-symlink-negative.mjs' -Encoding utf8
          node 'C:\misen-temp\external-symlink-negative.mjs'
      - name: July/August acceptance
        shell: pwsh
        run: |
          Set-Location 'C:\misen-pr76\apps\enterprise-misen'
          npm run acceptance
      - name: Production provenance unchanged
        shell: pwsh
        run: |
          Set-Location 'C:\misen-pr76'
          git diff --exit-code f3b772f7765206f75f7296e436d89c6a771b690a df2859c471fac035be062703f59f69e07d55b208 -- apps/enterprise-misen/src apps/enterprise-misen/acceptance apps/enterprise-misen/demo apps/enterprise-misen/package-lock.json
          git diff --exit-code df2859c471fac035be062703f59f69e07d55b208 $env:PR76_TARGET_SHA -- apps/enterprise-misen/src apps/enterprise-misen/acceptance apps/enterprise-misen/demo apps/enterprise-misen/package-lock.json
          git diff --check df2859c471fac035be062703f59f69e07d55b208 $env:PR76_TARGET_SHA
      - name: Build two reproducible prepared runtimes
        shell: pwsh
        run: |
          if (Test-Path 'C:\misen-package-a') { Remove-Item 'C:\misen-package-a' -Recurse -Force }
          if (Test-Path 'C:\misen-package-b') { Remove-Item 'C:\misen-package-b' -Recurse -Force }
          Set-Location 'C:\misen-pr76\apps\enterprise-misen'
          npm run prepare-runtime -- --output C:\misen-package-a --source-sha df2859c471fac035be062703f59f69e07d55b208 --packaging-sha $env:PR76_TARGET_SHA
          npm run prepare-runtime -- --output C:\misen-package-b --source-sha df2859c471fac035be062703f59f69e07d55b208 --packaging-sha $env:PR76_TARGET_SHA
          $a = Get-Content 'C:\misen-package-a\SHA256SUMS.txt' -Raw
          $b = Get-Content 'C:\misen-package-b\SHA256SUMS.txt' -Raw
          if ($a -cne $b) { throw 'prepared runtime hash lists are not reproducible' }
          $manifest = Get-Content 'C:\misen-package-a\manifest.json' -Raw | ConvertFrom-Json
          if ($manifest.schemaVersion -ne 2) { throw 'unexpected manifest schema' }
          if ($manifest.sourceSha -ne 'df2859c471fac035be062703f59f69e07d55b208') { throw 'source SHA mismatch' }
          if ($manifest.thinMisenBehaviorBaselineSha -ne 'f3b772f7765206f75f7296e436d89c6a771b690a') { throw 'behavior baseline mismatch' }
          if (-not (Test-Path 'C:\misen-package-a\workspace\AGENTS.md')) { throw 'AGENTS.md missing' }
          if (-not (Test-Path 'C:\misen-package-a\workspace\.agents\skills\monthly-report\SKILL.md')) { throw 'monthly-report Skill missing' }
          if (Test-Path 'C:\misen-package-a\app\dist\study') { throw 'study observer code was distributed' }
          if (Test-Path 'C:\misen-package-a\app\dist\test') { throw 'test code was distributed' }
          if (Test-Path 'C:\misen-package-a\app\dist\acceptance') { throw 'acceptance code was distributed' }
          $hashListDigest = (Get-FileHash 'C:\misen-package-a\SHA256SUMS.txt' -Algorithm SHA256).Hash
          [pscustomobject]@{
            sourceSha = $manifest.sourceSha
            behaviorBaselineSha = $manifest.thinMisenBehaviorBaselineSha
            packagingSha = $manifest.packagingSha
            fileCount = $manifest.inventory.fileCount
            totalBytes = $manifest.inventory.totalBytes
            productionDependencyPackageCount = $manifest.dependencyProvenance.productionDependencyPackageCount
            hashListSha256 = $hashListDigest
          } | ConvertTo-Json -Compress
      - name: Verify Node-only startup package
        shell: pwsh
        run: |
          Set-Location 'C:\misen-pr76\apps\enterprise-misen'
          npm run verify:prepared-runtime -- --runtime C:\misen-package-a
      - name: Production dependency audit
        shell: pwsh
        run: |
          Set-Location 'C:\misen-pr76\apps\enterprise-misen'
          npm audit --omit=dev --package-lock-only
      - name: SBOM validation
        shell: pwsh
        run: |
          Set-Location 'C:\misen-pr76\apps\enterprise-misen'
          npm run sbom
