name: release-share

# 共有フォルダー配布物（Misen起動.cmd + _misen\versions\<version>\）を GitHub Actions 上で生成し、
# GitHub Release に zip として添付する。開発 PC のファイルは一切使わない。
# 社内 PC では Release から zip を落とし、scripts/Expand-MisenShare.ps1 で共有フォルダーへ展開する。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '配布版数（空なら apps/enterprise-misen/package.json の version）'
        required: false
        default: ''
      prerelease:
        description: 'プレリリースとして公開する'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'share-v*'

permissions:
  contents: write

concurrency:
  group: release-share
  cancel-in-progress: false

jobs:
  build-share:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 版数を決める
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if (-not $v) {
            if ('${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}' -replace '^share-v', '' }
            else { $v = (Get-Content apps/enterprise-misen/package.json -Raw | ConvertFrom-Json).version }
          }
          $sha = '${{ github.sha }}'.Substring(0, 7)
          "version=$v" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "tag=share-v$v-$sha" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v sha=$sha"

      - name: 配布物を生成して共有フォルダー形式へ公開
        shell: pwsh
        run: |
          $share = Join-Path $env:RUNNER_TEMP 'share'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File scripts/Prepare-Misen.ps1 -Destination $share -Version '${{ steps.ver.outputs.version }}' -Staging (Join-Path $env:RUNNER_TEMP 'staging') -CleanDestination
          if ($LASTEXITCODE -ne 0) { throw "Prepare-Misen.ps1 failed ($LASTEXITCODE)" }
          Get-Content (Join-Path $share '_misen\publish-log.txt') -Encoding UTF8 | Select-Object -Last 1

      - name: zip 化と SHA-256
        id: zip
        shell: pwsh
        run: |
          $share = Join-Path $env:RUNNER_TEMP 'share'
          $name = 'misen-share-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.sha }}'
          $out = Join-Path $env:RUNNER_TEMP "$name.zip"
          # 隠し属性は zip に残らないので、展開側（Expand-MisenShare.ps1）で付け直す。
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($share, $out, [System.IO.Compression.CompressionLevel]::Optimal, $false, [System.Text.Encoding]::UTF8)
          $hash = (Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -LiteralPath "$out.sha256.txt" -Encoding ascii
          $count = (Get-ChildItem $share -Recurse -File -Force).Count
          "path=$out" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT
          "files=$count" >> $env:GITHUB_OUTPUT
          "size=$((Get-Item $out).Length)" >> $env:GITHUB_OUTPUT

      - name: Release を作成
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          $notes = @(
            '# Enterprise Misen 共有フォルダー配布物 v${{ steps.ver.outputs.version }}',
            '',
            'GitHub Actions（windows-latest）で main の `${{ github.sha }}` から生成。開発 PC のファイルは含まない。',
            '',
            '- 配布物: `${{ steps.zip.outputs.name }}.zip`（${{ steps.zip.outputs.size }} bytes、${{ steps.zip.outputs.files }} files）',
            '- zip SHA-256: `${{ steps.zip.outputs.hash }}`',
            '- Node.js と OfficeCLI は公式配布物を取得し、契約ファイルの SHA-256 で検証済み',
            '',
            '## 社内 PC での展開',
            '',
            '1. この Release から zip、`.sha256.txt`、`Expand-MisenShare.ps1` の 3 つを同じフォルダーへダウンロードする',
            '2. PowerShell で次を実行する（共有フォルダーのパスは置き換える）',
            '',
            '```',
            'powershell -NoProfile -ExecutionPolicy Bypass -File .\Expand-MisenShare.ps1 -Zip .\${{ steps.zip.outputs.name }}.zip -Destination "\\fileserver\財務\Misen"',
            '```',
            '',
            '3. 利用者は共有フォルダーの `Misen起動.cmd` をダブルクリックする',
            '',
            '詳細は DEPLOY.md の「GitHub 経由の配布」を参照。'
          ) -join "`n"
          $pre = if ('${{ github.event.inputs.prerelease }}' -eq 'false') { @() } else { @('--prerelease') }
          gh release create $tag '${{ steps.zip.outputs.path }}' '${{ steps.zip.outputs.path }}.sha256.txt' 'scripts/Expand-MisenShare.ps1' --title "共有フォルダー配布物 v${{ steps.ver.outputs.version }} (${{ steps.ver.outputs.sha }})" --notes $notes --target '${{ github.sha }}' @pre
